global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: infraguard-drift-engine
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: infraguard-compliance
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: infraguard-remediation
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: nats-monitoring
    static_configs:
      - targets: ['nats:8222']
    metrics_path: /metrics
