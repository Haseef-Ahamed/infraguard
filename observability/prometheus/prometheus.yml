global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: infraguard-drift-engine
    static_configs: [{targets: ['host.docker.internal:8080']}]
  - job_name: infraguard-remediation
    static_configs: [{targets: ['host.docker.internal:8082']}]
