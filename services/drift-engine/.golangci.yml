run:
  timeout: 10m
  go: '1.22'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - exhaustive
    - exhaustruct
    - gochecknoglobals
    - nlreturn
    - wrapcheck

linters-settings:
  staticcheck:
    checks: ["all", "-SA1019"]  # Disable deprecated warnings we already fixed

issues:
  exclude-rules:
    - path: "_test.go"
      linters: [errcheck]
