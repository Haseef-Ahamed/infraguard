apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraguard-sa
  namespace: drift-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infraguard-drift-engine
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infraguard-drift-engine
subjects:
  - kind: ServiceAccount
    name: infraguard-sa
    namespace: drift-engine
roleRef:
  kind: ClusterRole
  name: infraguard-drift-engine
  apiGroup: rbac.authorization.k8s.io
