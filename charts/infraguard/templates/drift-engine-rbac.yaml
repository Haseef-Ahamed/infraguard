{{- if .Values.driftEngine.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.driftEngine.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraguard-sa
  namespace: {{ .Values.driftEngine.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infraguard-drift-engine
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infraguard-drift-engine
subjects:
  - kind: ServiceAccount
    name: infraguard-sa
    namespace: {{ .Values.driftEngine.namespace }}
roleRef:
  kind: ClusterRole
  name: infraguard-drift-engine
  apiGroup: rbac.authorization.k8s.io
{{- end }}
