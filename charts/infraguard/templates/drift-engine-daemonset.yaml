{{- if .Values.driftEngine.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: drift-engine
  namespace: {{ .Values.driftEngine.namespace }}
  labels:
    app: drift-engine
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  selector:
    matchLabels:
      app: drift-engine
  template:
    metadata:
      labels:
        app: drift-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.driftEngine.metricsPort }}"
    spec:
      serviceAccountName: infraguard-sa
      containers:
        - name: drift-engine
          image: "{{ .Values.driftEngine.image.repository }}:{{ .Values.driftEngine.image.tag }}"
          imagePullPolicy: {{ .Values.driftEngine.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.driftEngine.metricsPort }}
          envFrom:
            - configMapRef:
                name: drift-engine-config
          resources:
            {{- toYaml .Values.driftEngine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.driftEngine.metricsPort }}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.driftEngine.metricsPort }}
            initialDelaySeconds: 10
{{- end }}
