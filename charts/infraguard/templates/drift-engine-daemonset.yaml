apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: drift-engine
  namespace: drift-engine
  labels:
    app: drift-engine
    component: detection
    version: v1
spec:
  selector:
    matchLabels:
      app: drift-engine
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: drift-engine
        component: detection
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: infraguard-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: drift-engine
          image: infraguard/drift-engine:latest
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: drift-engine-config
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
