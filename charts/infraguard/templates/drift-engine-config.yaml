{{- if .Values.driftEngine.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: drift-engine-config
  namespace: {{ .Values.driftEngine.namespace }}
data:
  VAULT_ADDR: {{ .Values.global.vaultAddr | quote }}
  VAULT_TOKEN: {{ .Values.global.vaultToken | quote }}
  METRICS_ADDR: ":{{ .Values.driftEngine.metricsPort }}"
  SCAN_INTERVAL_SECONDS: {{ .Values.driftEngine.scanIntervalSeconds | quote }}
{{- end }}
