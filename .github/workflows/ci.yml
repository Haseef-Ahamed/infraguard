name: InfraGuard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.12'

jobs:

  lint-go:
    name: Lint Go Services
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        working-directory: services/drift-engine
        run: |
          go mod tidy
          golangci-lint run ./... --timeout 10m

  lint-python:
    name: Lint Python
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: flake8
        working-directory: services/ml-predictor
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install flake8 --quiet
          flake8 src/ --max-line-length=120 --ignore=E501,W503,E221,E241,E251,E226,E302,W391,E203

  test-go:
    name: Test Go Services
    runs-on: self-hosted
    needs: lint-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        working-directory: services/drift-engine
        run: go test -v -race -timeout 120s ./...

  test-python:
    name: Test Python
    runs-on: self-hosted
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - name: pytest with venv
        working-directory: services/ml-predictor
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt --quiet
          python3 -m pytest tests/ -v --tb=short

  validate-iac:
    name: Validate IaC
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: tofu validate
        working-directory: infra
        run: |
          tofu init -backend=false -input=false
          tofu validate
          tofu fmt -check -recursive

  checkov-scan:
    name: Checkov IaC Scan
    runs-on: self-hosted
    needs: validate-iac
    steps:
      - uses: actions/checkout@v4
      - name: checkov
        run: |
          checkov -d infra/ \
            --framework terraform \
            --quiet \
            --compact \
            --soft-fail-on HIGH \
            --soft-fail-on MEDIUM \
            --skip-check CKV_AWS_382,CKV2_AWS_5,CKV2_AWS_11,CKV2_AWS_12,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_18,CKV_AWS_144,CKV_AWS_145

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: gitleaks detect --source . --log-opts HEAD~1..HEAD --verbose
